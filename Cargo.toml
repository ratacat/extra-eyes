[package]
name = "extra-eyes"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "eyes"
path = "src/bin/eyes.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
hex = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
